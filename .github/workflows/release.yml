name: 发布 Release 与 npm 包

# 推送 v* 标签时触发，例如：git tag v1.0.0 && git push origin v1.0.0
# 标签名必须与 package.json 里的 version 一致（v1.0.0 对应 1.0.0）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: 校验版本、发布 npm 并创建 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装 Node.js 并升级 npm
        uses: actions/setup-node@v7
        with:
          node-version: 22
      # Node 22 自带 npm 10.x，不满足 Trusted Publishing 的 npm >= 11.15.0，
      # 因此显式升级到 npm 11（11.x 兼容 Node 22，且满足版本要求）。
      - name: 升级 npm 到 11.x
        run: npm install -g npm@^11.15.0
      # 使用 npm Trusted Publishing（OIDC）：不配置 registry-url、不设置 NODE_AUTH_TOKEN。
      # 信任关系在 npmjs.com 的包设置里配置：仓库 wastee/dsh-goal-record-board，
      # workflow 文件 release.yml，允许 publish。
      - name: 确认 npm 版本满足 OIDC 发布要求
        run: |
          set -eu
          NPM_VERSION="$(npm -v)"
          echo "npm 版本: $NPM_VERSION"
          node -e "
            const [maj, min] = '$NPM_VERSION'.split('.').map(Number);
            if (maj < 11 || (maj === 11 && min < 15)) {
              console.error('::error::npm 版本需 >= 11.15.0 才能用 Trusted Publishing');
              process.exit(1);
            }
          "

      - name: 校验标签与包版本一致
        id: version
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "标签: $TAG，package.json 版本: $PKG_VERSION"
          if [ "$TAG" != "v${PKG_VERSION}" ]; then
            echo "::error::标签 $TAG 与包版本 $PKG_VERSION 不一致，标签应为 v${PKG_VERSION}"
            exit 1
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: 校验 manifest 可发布
        run: |
          set -eu
          node -e "
            const p = require('./package.json');
            if (p.private) throw new Error('package.json 仍为 private，不能发布');
            if (!p.dsh || !p.dsh.bundle) throw new Error('缺少 dsh.bundle 声明');
            console.log('manifest 校验通过:', p.name, p.version);
          "

      - name: 打包 tarball
        id: pack
        run: |
          set -eu
          TARBALL="$(npm pack --silent)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "打包完成: $TARBALL"
          tar -tzf "$TARBALL"

      - name: 发布到 npm（Trusted Publishing / OIDC）
        run: |
          set -eu
          npm publish --access public

      - name: 创建 GitHub Release 并上传 tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -eu
          gh release create "$TAG" "$TARBALL" \
            --title "$TAG" \
            --generate-notes \
            --notes "安装：dsh plugin add @wastee/dsh-goal-record-board"
